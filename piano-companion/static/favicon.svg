<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for YouTube Red Badge -->
    <linearGradient id="ytRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2430" />
      <stop offset="100%" stop-color="#D00018" />
    </linearGradient>

    <!-- Drop Shadow Filter for Neo-brutalist depth -->
    <filter id="neoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="0" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="playShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Clip Path for Piano Keys inside YouTube Badge -->
    <clipPath id="badgeClip">
      <rect x="36" y="66" width="440" height="368" rx="96" ry="96" />
    </clipPath>
  </defs>

  <!-- Neo-brutalist Under-Shadow Badge -->
  <rect x="36" y="80" width="440" height="368" rx="96" ry="96" fill="#000000" />

  <!-- Main YouTube Red Badge -->
  <rect
    x="36"
    y="66"
    width="440"
    height="368"
    rx="96"
    ry="96"
    fill="url(#ytRed)"
    stroke="#000000"
    stroke-width="16"
  />

  <!-- Subtle Top Badge Highlight -->
  <path
    d="M 120 86 Q 256 74 392 86"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.35"
  />

  <!-- Integrated Piano Keyboard (clipped inside badge base) -->
  <g clip-path="url(#badgeClip)">
    <!-- Keyboard Backing / Baseline -->
    <rect x="36" y="276" width="440" height="170" fill="#000000" />

    <!-- 7 White Keys (Ivory) -->
    <!-- Key 1: C -->
    <rect x="42" y="284" width="58" height="150" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <!-- Key 2: D -->
    <rect x="104" y="284" width="58" height="150" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <!-- Key 3: E -->
    <rect x="166" y="284" width="58" height="150" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <!-- Key 4: F -->
    <rect x="228" y="284" width="58" height="150" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <!-- Key 5: G -->
    <rect x="290" y="284" width="58" height="150" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <!-- Key 6: A -->
    <rect x="352" y="284" width="58" height="150" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <!-- Key 7: B -->
    <rect x="414" y="284" width="58" height="150" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="4" />

    <!-- 5 Black Accidental Keys (Ebony) -->
    <!-- Black Key 1 (C#) -->
    <rect x="84" y="284" width="36" height="92" rx="4" fill="#181818" stroke="#000000" stroke-width="3" />
    <rect x="88" y="286" width="6" height="84" rx="2" fill="#444444" />

    <!-- Black Key 2 (D#) -->
    <rect x="146" y="284" width="36" height="92" rx="4" fill="#181818" stroke="#000000" stroke-width="3" />
    <rect x="150" y="286" width="6" height="84" rx="2" fill="#444444" />

    <!-- Black Key 3 (F#) -->
    <rect x="270" y="284" width="36" height="92" rx="4" fill="#181818" stroke="#000000" stroke-width="3" />
    <rect x="274" y="286" width="6" height="84" rx="2" fill="#444444" />

    <!-- Black Key 4 (G#) -->
    <rect x="332" y="284" width="36" height="92" rx="4" fill="#181818" stroke="#000000" stroke-width="3" />
    <rect x="336" y="286" width="6" height="84" rx="2" fill="#444444" />

    <!-- Black Key 5 (A#) -->
    <rect x="394" y="284" width="36" height="92" rx="4" fill="#181818" stroke="#000000" stroke-width="3" />
    <rect x="398" y="286" width="6" height="84" rx="2" fill="#444444" />

    <!-- Keyboard Top Divider Bar -->
    <rect x="36" y="276" width="440" height="10" fill="#000000" />
    <rect x="36" y="278" width="440" height="4" fill="#FFD54F" />
  </g>

  <!-- Iconic YouTube Play Triangle Symbol (Central & Bold) -->
  <g filter="url(#playShadow)">
    <path
      d="M 206 138 C 196 132 184 138 184 150 L 184 278 C 184 290 196 296 206 290 L 320 226 C 330 220 330 208 320 202 Z"
      fill="#FFFFFF"
      stroke="#000000"
      stroke-width="12"
      stroke-linejoin="round"
    />
  </g>

  <!-- Sparkle Accent (Upper Right) -->
  <path
    d="M 390 120 Q 390 135 405 135 Q 390 135 390 150 Q 390 135 375 135 Q 390 135 390 120 Z"
    fill="#FFD54F"
    stroke="#000000"
    stroke-width="3"
  />
</svg>
