<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="maskableBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2430" />
      <stop offset="100%" stop-color="#C00016" />
    </linearGradient>

    <clipPath id="innerBadgeClip">
      <rect x="76" y="116" width="360" height="280" rx="72" ry="72" />
    </clipPath>
  </defs>

  <!-- Full Canvas Maskable Background (Ensures edge-to-edge color when cropped) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#maskableBg)" />

  <!-- Inner Badge Frame (Safe Zone is within 80% diameter = 410px circle) -->
  <!-- Shadow -->
  <rect x="76" y="128" width="360" height="280" rx="72" ry="72" fill="#000000" opacity="0.3" />

  <!-- Badge Body -->
  <rect
    x="76"
    y="116"
    width="360"
    height="280"
    rx="72"
    ry="72"
    fill="#E60026"
    stroke="#000000"
    stroke-width="12"
  />

  <!-- Top Badge Gloss Line -->
  <path
    d="M 140 132 Q 256 122 372 132"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
    opacity="0.4"
  />

  <!-- Piano Keyboard clipped into badge -->
  <g clip-path="url(#innerBadgeClip)">
    <rect x="76" y="270" width="360" height="130" fill="#000000" />

    <!-- 7 White Keys -->
    <rect x="82" y="276" width="48" height="120" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <rect x="133" y="276" width="48" height="120" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <rect x="184" y="276" width="48" height="120" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <rect x="235" y="276" width="48" height="120" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <rect x="286" y="276" width="48" height="120" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <rect x="337" y="276" width="48" height="120" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <rect x="388" y="276" width="48" height="120" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="3" />

    <!-- 5 Black Keys -->
    <rect x="116" y="276" width="30" height="74" rx="3" fill="#181818" stroke="#000000" stroke-width="2.5" />
    <rect x="167" y="276" width="30" height="74" rx="3" fill="#181818" stroke="#000000" stroke-width="2.5" />
    <rect x="269" y="276" width="30" height="74" rx="3" fill="#181818" stroke="#000000" stroke-width="2.5" />
    <rect x="320" y="276" width="30" height="74" rx="3" fill="#181818" stroke="#000000" stroke-width="2.5" />
    <rect x="371" y="276" width="30" height="74" rx="3" fill="#181818" stroke="#000000" stroke-width="2.5" />

    <!-- Keyboard Gold Accent Bar -->
    <rect x="76" y="270" width="360" height="6" fill="#FFD54F" />
  </g>

  <!-- YouTube Play Triangle -->
  <path
    d="M 218 174 C 210 169 200 174 200 184 L 200 274 C 200 284 210 289 218 284 L 298 234 C 306 229 306 219 298 214 Z"
    fill="#FFFFFF"
    stroke="#000000"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Sparkle Accent -->
  <path
    d="M 370 156 Q 370 168 382 168 Q 370 168 370 180 Q 370 168 358 168 Q 370 168 370 156 Z"
    fill="#FFD54F"
    stroke="#000000"
    stroke-width="2.5"
  />
</svg>
