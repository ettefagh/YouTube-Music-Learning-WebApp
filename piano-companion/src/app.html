<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<meta name="theme-color" content="#FF0033" />
		%sveltekit.head%

    <style>
      :root {
        /* Canvas & Surface - Direction 2 (Retro Arcade Pop) */
        --bg-canvas: #F5F3FF;
        --text-main: #0F0E17;
        --text-muted: #5F5E6B;
        --card-bg: #FFFFFF;
        --border-color: #0F0E17;
        --border-width: 3px;
        --shadow-color: #000000;
        --shadow-depth: 4px 4px 0px #000000;

        /* Brand & Semantic Accents */
        --brand-red: #FF3366;
        --accent-cyan: #00D2D3;
        --accent-gold: #FFB703;
        --accent-amber: #FF9F43;
        --accent-mint: #38EF7D;
        --accent-sky: #4D96FF;
        --accent-purple: #A66CFF;
        --accent-coral: #FF6B6B;
        --star-gold: #FFD000;
        --cinema-stage: #EBE8F8;

        /* Teacher Identity Colors */
        --avatar-aniko: #FF6B6B;
        --avatar-gavin: #4D96FF;
        --avatar-vika: #A66CFF;
        --avatar-overhead: #38EF7D;
        --avatar-studio: #FF9F43;

        /* Soft Neo-Brutalist Card Pastels */
        --tint-yellow: #FFF8E1;
        --tint-mint: #E8F5E9;
        --tint-blue: #E1F5FE;
        --tint-purple: #F3E8FF;
        --tint-coral: #FFE4E6;

        /* Strict Geometric Grammar (Max 3 Primary Shapes) */
        --radius-stage: 16px;
        --radius-capsule: 9999px;
        --radius-token: 50%;
        --min-tap-lg: 64px;
        --min-tap-md: 48px;
        --min-tap-sm: 40px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          /* Canvas & Surface - Direction 2 (Cyber-Studio Dark) */
          --bg-canvas: #0F0E17;
          --text-main: #FFFFFE;
          --text-muted: #A7A9BE;
          --card-bg: #1A192B;
          --border-color: #000000;
          --shadow-color: #000000;
          --shadow-depth: 4px 4px 0px #000000;

          /* Cyber Neon Accents */
          --brand-red: #FF0055;
          --accent-cyan: #00F5D4;
          --accent-gold: #FFDE59;
          --accent-amber: #FFA94D;
          --accent-mint: #00FFA3;
          --accent-sky: #6BCB77;
          --accent-purple: #C084FC;
          --accent-coral: #FF8E8E;
          --star-gold: #FFE600;
          --cinema-stage: #08070D;

          /* Teacher Identity Colors */
          --avatar-aniko: #FF8E8E;
          --avatar-gavin: #6BCB77;
          --avatar-vika: #C084FC;
          --avatar-overhead: #00FFA3;
          --avatar-studio: #FFA94D;

          /* Dark Mode Surfaces */
          --tint-yellow: #2B2618;
          --tint-mint: #15291E;
          --tint-blue: #132738;
          --tint-purple: #261638;
          --tint-coral: #331520;
        }
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        background-color: var(--bg-canvas);
        color: var(--text-main);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
    </style>
    </head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
