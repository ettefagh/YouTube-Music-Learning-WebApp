<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<meta name="theme-color" content="#FF0033" />
		%sveltekit.head%

    <style>
      :root {
        --bg-canvas: #FAF5ED;
        --text-main: #181818;
        --text-muted: #555555;
        --card-bg: #ffffff;
        --border-color: #000000;
        --border-width: 3px;
        --shadow-color: #000000;
        --shadow-depth: 4px 4px 0px #000000;

        /* Brand & Semantic Accents */
        --brand-red: #FF1A35;
        --accent-gold: #FFC107;
        --accent-amber: #FFB300;
        --accent-mint: #4CAF50;
        --accent-sky: #0288D1;
        --accent-purple: #7E57C2;
        --accent-coral: #FF7043;

        /* Soft Neo-Brutalist Card Pastels */
        --tint-yellow: #FFF8E1;
        --tint-mint: #E8F5E9;
        --tint-blue: #E1F5FE;
        --tint-purple: #EDE7F6;
        --tint-coral: #FBE9E7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-canvas: #1C1B1A;
          --text-main: #F5F5F5;
          --text-muted: #B0B0B0;
          --card-bg: #262524;
          --border-color: #000000;
          --shadow-color: #000000;
          --brand-red: #FF334B;
          --accent-gold: #FFD54F;
          --accent-amber: #FFCA28;
          --accent-mint: #66BB6A;
          --accent-sky: #42A5F5;
          --accent-purple: #9575CD;
          --accent-coral: #FF8A65;
          --tint-yellow: #332E1C;
          --tint-mint: #1B3022;
          --tint-blue: #162B38;
          --tint-purple: #271E36;
          --tint-coral: #36221C;
        }
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        background-color: var(--bg-canvas);
        color: var(--text-main);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
    </style>
    </head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
